# Apex landing deploy.
#
# Builds the apex static export (`pnpm build:apex`) and pushes it to
# the S3 bucket fronted by CloudFront at https://thebetterdecision.com.
# Auth is via GitHub OIDC -> AWS IAM role (no long-lived AWS keys).
#
# The IAM role's trust policy (provisioned by PR #240) only accepts
# tokens whose `sub` claim matches `repo:fjcloudaiconsulting/tbd:ref:refs/heads/main`.
# That is the load-bearing security boundary; this workflow's
# `branches: [main]` trigger is belt-and-suspenders.
#
# ⚠ THE PATH FILTER BELOW NO LONGER MIRRORS ANYTHING (TBD-424,
# 2026-08-20). It used to be the positive half of a two-sided split with a
# negation list in release.yml; release.yml's `paths:` filter is gone, so
# this is now the ONLY hand-maintained path allowlist in the repo. Nothing
# else agrees or disagrees with it, and nothing tests it.
#
# ⚠ It DID drift, for ~72 days (TBD-433, fixed 2026-08-21). `features/`,
# `compare/` and `vs/` were added to build-apex.sh on 2026-06-09 (#421) and
# never mirrored here, so a change confined to any of them published NOTHING
# to thebetterdecision.com while still triggering a full DO redeploy of the
# authed app — inverted from the intent, and masked only because the one
# landing PR that touched `features/` also touched `privacy/`. The same
# failure had already happened once (#466) and was patched by adding two
# more entries rather than by making the lists check each other.
#
# ⚠⚠ IT IS NOW FENCED. `backend/tests/test_apex_deploy_paths.py` derives the
# required entries from build-apex.sh's ALLOWED_ROUTE_DIRS and
# ALLOWED_APP_FILES and FAILS if this list does not cover them. Adding a
# route dir to build-apex.sh without adding it here is now a red build, not a
# silent 72-day outage. If that fence goes red, add the path — do not widen
# the fence.
#
# ⚠ A grep is NOT a substitute for that fence: while fixing this,
# `grep -q "frontend/app/features/"` over this whole file PASSED, because the
# string appears in THIS COMMENT. The fence parses `on.push.paths`.
#
# ⚠ Do NOT "fix" the drift by deleting the filter the way release.yml's was
# deleted. The two are not analogous. release.yml's filter was redundant with
# its release gate; this one is the only thing bounding COST. Every run here
# does an S3 sync plus a CloudFront `/*` invalidation, and invalidations past
# 1,000/month are metered. Removing it buys one invalidation per merge to
# main, forever.
#
# Shared paths (globals.css, lib/brand.ts, public/fonts/**) are listed here
# AND still rebuild the DO app: a brand or token change legitimately affects
# both surfaces.
#
# Required GitHub repository variables (Settings -> Secrets and variables
# -> Actions -> Variables tab):
#   AWS_APEX_DEPLOY_ROLE_ARN  ARN of github-actions-apex-deploy role
#                             (Terraform output: github_actions_role_arn)
#   AWS_APEX_BUCKET           S3 bucket name
#                             (Terraform output: s3_bucket_name)
#   AWS_APEX_DISTRIBUTION_ID  CloudFront distribution ID
#                             (Terraform output: cloudfront_distribution_id)
#
# No secrets are needed. The role ARN, bucket name, and distribution ID
# are public-shaped identifiers.

name: Deploy Apex Landing

on:
  # Manual redeploy. Use this to re-publish the apex static export without a
  # code change — e.g. after a GA gateway path swap, or to recover from a
  # stale deploy when a relevant change landed outside the paths filter below.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Landing surface in app/
      - "frontend/app/page.tsx"
      - "frontend/app/privacy/**"
      - "frontend/app/terms/**"
      - "frontend/app/docs/**"
      # TBD-433. These three shipped to the apex from 2026-06-09 (#421) and
      # were never mirrored here, so a change confined to any of them
      # published NOTHING to thebetterdecision.com for ~72 days while still
      # triggering a full DigitalOcean redeploy of the authed app. Exactly
      # inverted from the intent. `backend/tests/test_apex_deploy_paths.py`
      # now derives the required set from build-apex.sh and fails if they
      # diverge again.
      - "frontend/app/features/**"
      - "frontend/app/compare/**"
      - "frontend/app/vs/**"
      # Structural app-level files retained by build-apex.sh
      # (frontend/scripts/build-apex.sh's ALLOWED_APP_FILES allowlist).
      # Changing any of these can change what the apex bundle ships.
      - "frontend/app/layout.tsx"
      - "frontend/app/not-found.tsx"
      - "frontend/app/error.tsx"
      - "frontend/app/loading.tsx"
      - "frontend/app/global-error.tsx"
      - "frontend/app/icon.svg"
      - "frontend/app/globals.css"
      # Landing components and apex-build helpers
      - "frontend/components/landing/**"
      # GA4 is rendered into the apex layout (GoogleAnalytics.tsx is mounted
      # in app/layout.tsx; both read from lib/analytics.ts). An analytics-only
      # change — e.g. swapping the GA tag-gateway path — must redeploy the apex
      # static export, otherwise the live HTML keeps the old path baked in and
      # 404s once the matching CloudFront behavior is renamed (the /88x6/ ->
      # /vd9r/ incident, #465).
      - "frontend/components/analytics/**"
      - "frontend/lib/analytics.ts"
      - "frontend/components/auth/AuthProviderApex.tsx"
      - "frontend/scripts/build-apex.sh"
      - "frontend/next.config.apex.ts"
      - "frontend/lib/links.ts"
      # TBD-433: imported by app/privacy, app/terms, app/features and
      # components/landing/faqData.ts. A retention-window change that ships to
      # the authed app but not here publishes CONTRADICTORY legal claims across
      # the two surfaces.
      - "frontend/lib/dataPolicy.ts"
      # Shared dependencies imported by the retained app/layout.tsx,
      # page.tsx, and landing components (transitive grep of
      # `from "@/..."` across the apex-retained surface).
      # These are SHARED with the DO app build, so they intentionally
      # remain positive matches in release.yml as well.
      - "frontend/lib/brand.ts"
      - "frontend/lib/site.ts"
      - "frontend/lib/styles.ts"
      - "frontend/components/brand/**"
      - "frontend/components/ThemeProvider.tsx"
      # tour/** rather than just TourProvider.tsx because TourProvider
      # imports useTour and any future split helper files; useTour code
      # is bundled into the apex output (verified by grepping the built
      # _next/static chunks for the `tbd-pending-dashboard-tour` marker).
      - "frontend/components/tour/**"
      - "frontend/components/ui/BackLink.tsx"
      - "frontend/components/ui/CurrentYear.tsx"
      - "frontend/components/ui/ThemeToggle.tsx"
      - "frontend/public/**"
      # Dependencies the apex build resolves
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      # INFRA-60: the tbd-landing Worker (config, worker.js, _headers)
      - "frontend/apex-worker/**"
      # The workflow itself
      - ".github/workflows/apex-deploy.yml"

permissions:
  contents: read
  id-token: write

# Serialize deploys; never cancel an in-flight S3 sync.
concurrency:
  group: apex-deploy
  cancel-in-progress: false

jobs:
  # TBD-391. Same interlock as release.yml — the landing surface carried the
  # identical race (push to main, no dependency on the Test run).
  #
  # ⚠ A SEPARATE JOB, not a step inside build-and-deploy. That job's
  # `timeout-minutes: 15` is already largely consumed by `pnpm install` +
  # `build:apex`; adding an ~8 minute wait inside it would convert a healthy
  # deploy into a timeout failure. The wait gets its own budget.
  #
  # ⚠ SKIPPED for manual dispatch. This workflow's `workflow_dispatch` is the
  # documented recovery path for a stale deploy (see the trigger comment
  # above), and gating it on some unrelated commit's suite would defeat the
  # recovery it exists for. Same treatment as deploy.yml.
  await-tests:
    name: Await post-merge tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_dispatch'
    permissions:
      # Job-level permissions REPLACE the workflow-level block, which is what
      # we want here: it drops `id-token: write` for the wait, so the OIDC
      # credential is never exposed to the polling step. `actions: read` is
      # required to list workflow runs — omit it and the call 403s and the
      # gate fails closed for a reason that looks like a working gate.
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Wait for the Test workflow on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/ci/await-test-run.sh "${{ github.sha }}"

  build-and-deploy:
    name: Build and deploy apex
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: await-tests
    # ⚠ THE SHARPEST EDGE IN THIS CHANGE. `needs:` on a SKIPPED job skips the
    # dependent by default, so without this clause a manual dispatch — the
    # recovery path — would silently do nothing at all. `!cancelled()` keeps a
    # real cancellation propagating; the explicit dispatch arm restores the
    # bypass.
    if: >-
      ${{ !cancelled()
          && (needs.await-tests.result == 'success'
              || github.event_name == 'workflow_dispatch') }}

    env:
      # Region is a repo variable so a future TFC `aws_region` change does
      # not require touching this workflow. Fallback keeps the workflow
      # functional if the variable was forgotten during setup.
      AWS_REGION: ${{ vars.AWS_APEX_REGION || 'eu-central-1' }}
      S3_BUCKET: ${{ vars.AWS_APEX_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_APEX_DISTRIBUTION_ID }}
      DEPLOY_ROLE_ARN: ${{ vars.AWS_APEX_DEPLOY_ROLE_ARN }}
      # INFRA-60. 'true' once the owner stores the Worker deploy token; until then the
      # Worker steps below skip and this job stays green on the S3 deploy alone.
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      # pnpm version comes from packageManager in frontend/package.json.
      - name: Enable pnpm
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build apex static export
        working-directory: frontend
        env:
          TBD_BUILD_TARGET: apex
          TBD_SITE_URL: https://thebetterdecision.com
          TBD_APP_URL: https://app.thebetterdecision.com
        run: pnpm build:apex

      - name: Verify build output
        working-directory: frontend
        run: |
          test -f out-apex/index.html || { echo "out-apex/index.html missing"; exit 1; }
          test -f out-apex/_meta.json || { echo "out-apex/_meta.json missing"; exit 1; }
          echo "Build output OK:"
          ls -la out-apex/ | head -20

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-apex-deploy-${{ github.run_id }}

      # Cache strategy + deploy order.
      #
      # Cache:
      #   - Hashed assets under _next/static/** are content-addressed by
      #     Next.js, safe to lock at max-age=31536000, immutable.
      #   - Everything else lives under stable URLs (HTML, icons,
      #     OG/apple images, fonts, JSON, txt, xml). Short cache so a
      #     future change is visible to clients that already cached the
      #     old object, regardless of CloudFront invalidation.
      #
      # Order: hashed chunks FIRST without --delete, then mutable assets
      # with --delete. Two reasons:
      #   1. The newly-published HTML references new hashed-asset URLs,
      #      so those chunks must exist in S3 before the HTML is visible.
      #   2. Browser-cached old HTML (5-min TTL) still references old
      #      hashed-asset URLs; deleting those mid-flight produces 404s
      #      for users who have not yet refetched the HTML.
      #
      # Trade-off: orphaned hashed chunks accumulate in the bucket. They
      # are pennies of storage and the S3 lifecycle policy provisioned by
      # PR #240 prunes noncurrent VERSIONS after 90 days, but NOT
      # orphaned-by-rename objects. Periodic cleanup of stale objects
      # under _next/static/** (older than N days, not referenced by any
      # current HTML) is a follow-up via an S3 lifecycle rule or a
      # scheduled GH Actions workflow. Tracked separately.

      - name: Sync immutable hashed assets (long cache, NO --delete)
        working-directory: frontend
        run: |
          aws s3 sync out-apex/_next/static/ "s3://${S3_BUCKET}/_next/static/" \
            --no-progress \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync mutable assets (short cache, --delete)
        working-directory: frontend
        run: |
          aws s3 sync out-apex/ "s3://${S3_BUCKET}/" \
            --delete \
            --no-progress \
            --exclude "_next/static/*" \
            --cache-control "public, max-age=300, s-maxage=3600"

      - name: Override _meta.json with no-cache
        working-directory: frontend
        run: |
          # _meta.json is the deploy-verification probe. It must never be
          # cached so a curl against the apex returns the freshest SHA.
          # aws s3 sync auto-detected content-type as application/json on
          # the previous step; here we re-upload with the strict
          # cache-control + explicit content-type to be unambiguous.
          if [ -f out-apex/_meta.json ]; then
            aws s3 cp out-apex/_meta.json "s3://${S3_BUCKET}/_meta.json" \
              --no-progress \
              --content-type "application/json" \
              --cache-control "no-cache, no-store, must-revalidate"
          fi

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            >/dev/null

      # INFRA-60. The same build also goes to the tbd-landing Worker, workers.dev preview only
      # (https://tbd-landing.flamarion-fb5.workers.dev), until INFRA-61 moves the apex onto it
      # and deletes the S3 and CloudFront steps above. Runs after them so _headers never
      # reaches the bucket. Worker deploys are atomic, so the chunk ordering above is moot there.
      - name: Skip the Worker deploy (no CLOUDFLARE_API_TOKEN)
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, skipping the tbd-landing Worker deploy"

      - name: Stage Worker headers
        if: env.HAS_CF_TOKEN == 'true'
        working-directory: frontend
        run: cp apex-worker/_headers out-apex/_headers

      # Worker name, account, assets and routing all come from frontend/apex-worker/wrangler.jsonc.
      - name: Deploy tbd-landing Worker (workers.dev preview)
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.147.0"
          workingDirectory: frontend/apex-worker
          command: deploy

      - name: Smoke test the Worker preview
        if: env.HAS_CF_TOKEN == 'true'
        run: |
          # Retries cover workers.dev propagation on the first deploy.
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 10 https://tbd-landing.flamarion-fb5.workers.dev/_meta.json | grep -q "\"${GITHUB_SHA}\""; then
              echo "ok  preview serves ${GITHUB_SHA}"; exit 0
            fi
            sleep 5
          done
          echo "FAIL preview does not serve ${GITHUB_SHA}"; exit 1

      - name: Print deploy summary
        run: |
          echo "Deployed apex landing"
          echo "  Commit:        ${GITHUB_SHA}"
          echo "  Bucket:        ${S3_BUCKET}"
          echo "  Distribution:  ${CLOUDFRONT_DISTRIBUTION_ID}"
          echo "  Verify via:    https://thebetterdecision.com/_meta.json"
