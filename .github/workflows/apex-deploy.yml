# Apex landing deploy.
#
# Builds the apex static export (`pnpm build:apex`) and deploys it to the tbd-landing
# Cloudflare Worker, which serves https://thebetterdecision.com (INFRA-61). The S3 +
# CloudFront deploy it replaced was removed with the old stack (INFRA-62).
#
# ⚠ THE PATH FILTER BELOW NO LONGER MIRRORS ANYTHING (TBD-424,
# 2026-08-20). It used to be the positive half of a two-sided split with a
# negation list in release.yml; release.yml's `paths:` filter is gone, so
# this is now the ONLY hand-maintained path allowlist in the repo. Nothing
# else agrees or disagrees with it, and nothing tests it.
#
# ⚠ It DID drift, for ~72 days (TBD-433, fixed 2026-08-21). `features/`,
# `compare/` and `vs/` were added to build-apex.sh on 2026-06-09 (#421) and
# never mirrored here, so a change confined to any of them published NOTHING
# to thebetterdecision.com while still triggering a full DO redeploy of the
# authed app — inverted from the intent, and masked only because the one
# landing PR that touched `features/` also touched `privacy/`. The same
# failure had already happened once (#466) and was patched by adding two
# more entries rather than by making the lists check each other.
#
# ⚠⚠ IT IS NOW FENCED. `backend/tests/test_apex_deploy_paths.py` derives the
# required entries from build-apex.sh's ALLOWED_ROUTE_DIRS and
# ALLOWED_APP_FILES and FAILS if this list does not cover them. Adding a
# route dir to build-apex.sh without adding it here is now a red build, not a
# silent 72-day outage. If that fence goes red, add the path — do not widen
# the fence.
#
# ⚠ A grep is NOT a substitute for that fence: while fixing this,
# `grep -q "frontend/app/features/"` over this whole file PASSED, because the
# string appears in THIS COMMENT. The fence parses `on.push.paths`.
#
# Shared paths (globals.css, lib/brand.ts, public/fonts/**) are listed here
# AND still rebuild the DO app: a brand or token change legitimately affects
# both surfaces.
#
# The deploy-worker job needs one secret, CLOUDFLARE_API_TOKEN, in the `landing`
# environment (deployment branches: main only): an account-owned token with the
# Editor role scoped to the tbd-landing Worker alone. It skips with a notice
# while that secret is unset.

name: Deploy Apex Landing

on:
  # Manual redeploy. Use this to re-publish the apex static export without a
  # code change — e.g. after a GA gateway path swap, or to recover from a
  # stale deploy when a relevant change landed outside the paths filter below.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Landing surface in app/
      - "frontend/app/page.tsx"
      - "frontend/app/privacy/**"
      - "frontend/app/terms/**"
      - "frontend/app/docs/**"
      # TBD-433. These three shipped to the apex from 2026-06-09 (#421) and
      # were never mirrored here, so a change confined to any of them
      # published NOTHING to thebetterdecision.com for ~72 days while still
      # triggering a full redeploy of the authed app. Exactly inverted from
      # the intent. `backend/tests/test_apex_deploy_paths.py`
      # now derives the required set from build-apex.sh and fails if they
      # diverge again.
      - "frontend/app/features/**"
      - "frontend/app/compare/**"
      - "frontend/app/vs/**"
      # Structural app-level files retained by build-apex.sh
      # (frontend/scripts/build-apex.sh's ALLOWED_APP_FILES allowlist).
      # Changing any of these can change what the apex bundle ships.
      - "frontend/app/layout.tsx"
      - "frontend/app/not-found.tsx"
      - "frontend/app/error.tsx"
      - "frontend/app/loading.tsx"
      - "frontend/app/global-error.tsx"
      - "frontend/app/icon.svg"
      - "frontend/app/globals.css"
      # Landing components and apex-build helpers
      - "frontend/components/landing/**"
      # GA4 is rendered into the apex layout (GoogleAnalytics.tsx is mounted
      # in app/layout.tsx; both read from lib/analytics.ts). An analytics-only
      # change — e.g. swapping the GA tag-gateway path — must redeploy the apex
      # static export, otherwise the live HTML keeps the old path baked in and
      # 404s once the Worker's `run_worker_first` path is renamed (the /88x6/ ->
      # /vd9r/ incident, #465).
      - "frontend/components/analytics/**"
      - "frontend/lib/analytics.ts"
      - "frontend/components/auth/AuthProviderApex.tsx"
      - "frontend/scripts/build-apex.sh"
      - "frontend/next.config.apex.ts"
      - "frontend/lib/links.ts"
      # TBD-433: imported by app/privacy, app/terms, app/features and
      # components/landing/faqData.ts. A retention-window change that ships to
      # the authed app but not here publishes CONTRADICTORY legal claims across
      # the two surfaces.
      - "frontend/lib/dataPolicy.ts"
      # Shared dependencies imported by the retained app/layout.tsx,
      # page.tsx, and landing components (transitive grep of
      # `from "@/..."` across the apex-retained surface).
      # These are SHARED with the DO app build, so they intentionally
      # remain positive matches in release.yml as well.
      - "frontend/lib/brand.ts"
      - "frontend/lib/site.ts"
      - "frontend/lib/styles.ts"
      - "frontend/components/brand/**"
      - "frontend/components/ThemeProvider.tsx"
      # tour/** rather than just TourProvider.tsx because TourProvider
      # imports useTour and any future split helper files; useTour code
      # is bundled into the apex output (verified by grepping the built
      # _next/static chunks for the `tbd-pending-dashboard-tour` marker).
      - "frontend/components/tour/**"
      - "frontend/components/ui/BackLink.tsx"
      - "frontend/components/ui/CurrentYear.tsx"
      - "frontend/components/ui/ThemeToggle.tsx"
      - "frontend/public/**"
      # Dependencies the apex build resolves
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      # INFRA-60: the tbd-landing Worker (config, worker.js, _headers)
      - "frontend/apex-worker/**"
      # The workflow itself
      - ".github/workflows/apex-deploy.yml"

permissions:
  contents: read

# Serialize deploys; never cancel an in-flight one.
concurrency:
  group: apex-deploy
  cancel-in-progress: false

jobs:
  # TBD-391. Same interlock as release.yml — the landing surface carried the
  # identical race (push to main, no dependency on the Test run).
  #
  # ⚠ A SEPARATE JOB, not a step inside deploy-worker. That job's
  # `timeout-minutes: 15` is already largely consumed by `pnpm install` +
  # `build:apex`; adding an ~8 minute wait inside it would convert a healthy
  # deploy into a timeout failure. The wait gets its own budget.
  #
  # ⚠ SKIPPED for manual dispatch. This workflow's `workflow_dispatch` is the
  # documented recovery path for a stale deploy (see the trigger comment
  # above), and gating it on some unrelated commit's suite would defeat the
  # recovery it exists for.
  await-tests:
    name: Await post-merge tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_dispatch'
    permissions:
      # Job-level permissions REPLACE the workflow-level block. `actions: read` is
      # required to list workflow runs — omit it and the call 403s and the
      # gate fails closed for a reason that looks like a working gate.
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for the CI workflow on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/ci/await-test-run.sh "${{ github.sha }}"

  # INFRA-60/61. The export on the tbd-landing Worker, the apex's only origin. The smoke
  # test below reads the workers.dev name, which serves the same deploy.
  deploy-worker:
    name: Deploy tbd-landing Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: await-tests
    # `needs:` on a SKIPPED job (await-tests skips on dispatch) skips the dependent by default, so
    # `!cancelled()` and the explicit dispatch arm keep the manual recovery deploy working; a real
    # cancellation still propagates. Only from main: nothing else pins this job to main.
    if: >-
      ${{ !cancelled()
          && github.ref == 'refs/heads/main'
          && (needs.await-tests.result == 'success'
              || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
    # The token is a secret of the `landing` environment, whose deployment
    # branches are main only, not a repo secret any branch's workflow could read.
    # Without this line the job would see no environment secret and skip green.
    environment: landing
    env:
      # 'true' once the owner stores the token in the landing environment; until
      # then every step after the notice skips and the job stays green.
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - name: Skip (no CLOUDFLARE_API_TOKEN)
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set in the landing environment, skipping the tbd-landing Worker deploy"

      - name: Checkout
        if: env.HAS_CF_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        if: env.HAS_CF_TOKEN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install frontend dependencies
        if: env.HAS_CF_TOKEN == 'true'
        working-directory: frontend
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Build apex static export
        if: env.HAS_CF_TOKEN == 'true'
        working-directory: frontend
        env:
          TBD_BUILD_TARGET: apex
          TBD_SITE_URL: https://thebetterdecision.com
          TBD_APP_URL: https://app.thebetterdecision.com
        run: pnpm build:apex && cp apex-worker/_headers out-apex/_headers

      # Worker name, account, assets and routing all come from frontend/apex-worker/wrangler.jsonc.
      - name: Deploy
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.148.0"
          workingDirectory: frontend/apex-worker
          command: deploy

      - name: Smoke test the preview
        if: env.HAS_CF_TOKEN == 'true'
        run: |
          # Retries cover workers.dev propagation on the first deploy. The header
          # checks catch _headers rules Cloudflare dropped as invalid.
          base=https://tbd-landing.flamarion-fb5.workers.dev
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 10 "$base/_meta.json" | grep -q "\"${GITHUB_SHA}\""; then
              headers=$(curl -fsSI --max-time 10 "$base/") || { sleep 5; continue; }
              for h in '^content-security-policy: default-src' '^strict-transport-security: max-age=63072000' '^x-robots-tag: noindex'; do
                printf '%s' "$headers" | grep -qiE "$h" || { echo "FAIL $base/ lacks /$h/"; printf '%s\n' "$headers"; exit 1; }
              done
              echo "ok  preview serves ${GITHUB_SHA} with its headers"; exit 0
            fi
            sleep 5
          done
          echo "FAIL preview does not serve ${GITHUB_SHA}"; exit 1
