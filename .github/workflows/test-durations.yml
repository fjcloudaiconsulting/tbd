name: Test Durations

# Regenerates `backend/.test_durations`, the per-test timing file pytest-split
# uses to balance the `Backend Shard` matrix in test.yml.
#
# ⚠ WHY THIS IS A SEPARATE WORKFLOW AND NOT A STEP IN test.yml (TBD-421).
#
# `scripts/ci/await-test-run.sh` gates every production release on the RUN-level
# conclusion of `test.yml` for the merge commit. Adding a write/upload step to
# that workflow on `push: main` therefore puts a network-dependent operation on
# the one path the deploy interlock reads: an artifact-service blip in any shard
# would turn the run's conclusion to `failure`, `release.yml` would fail closed,
# and production would not deploy -- for a reason unrelated to whether the tests
# passed.
#
# Harvesting inside test.yml would also buy nothing. `test.yml` runs with
# `permissions: contents: read`, there is no `@semantic-release/git` in
# .releaserc.json, and `release.yml` sets `persist-credentials: false` -- so
# nothing in this repo has ever written a commit to `main`, and `main` requires
# reviews with `enforce_admins: true`. An in-CI harvest would still terminate in
# a human commit, exactly like this workflow, having added deploy-blocking risk
# for no saved step.
#
# ⚠ DO NOT REGENERATE THIS FILE LOCALLY. Two measured reasons:
#   1. `/app/.test_durations` is root-owned 0644 in the image while the backend
#      container runs as uid 1001, so `--store-durations` runs the ENTIRE suite
#      and then dies with PermissionError at pytest_sessionfinish. Twenty-five
#      minutes discarded at the final step.
#   2. Local per-test times are NOT a uniform rescaling of runner times.
#      Measured 2026-08-19: the stale file simulated against local timings
#      predicts a 1.35x max/min shard spread; CI actually observed 2.00x. A
#      uniform factor would cancel out (both split algorithms are
#      scale-invariant); a non-uniform one does not.

on:
  workflow_dispatch:
  schedule:
    # 04:17 UTC on the 1st. Off-peak, and the odd minute avoids the top-of-hour
    # scheduling queue that delays cron workflows on shared runners.
    - cron: "17 4 1 * *"
  # Self-test: run when this generator itself changes, so a PR editing it proves
  # it still works AND produces a committable artifact. Deliberately narrow --
  # this job is ~20 minutes and must not fire on ordinary PRs.
  pull_request:
    paths:
      - .github/workflows/test-durations.yml

permissions:
  contents: read

concurrency:
  group: test-durations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ⚠⚠ THE HARVEST MUST BE SHARDED THE WAY THE CONSUMPTION IS. MEASURED, TBD-421.
  #
  # The first version of this workflow ran the suite UNSHARDED, on the reasoning
  # that `backend/tests/` has no session- or module-scoped fixtures, so a
  # shard-measured duration should equal an unsharded one. That reasoning is
  # about fixture attribution and misses process-level accumulation.
  #
  # An unsharded harvest is ONE ~31-minute process; consumption is six short
  # ones. Late-position tests carry the long process's accumulated cost and are
  # overweighted. `DurationBasedChunksAlgorithm` cuts CONTIGUOUS slices, so
  # chunk N maps to collection position N and the error CONCENTRATES instead of
  # cancelling. Measured on run 32304646118 with an unsharded-harvest file:
  #
  #   shard  tests  predicted  actual  actual/predicted
  #     1      624     308s     283s        0.92
  #     3      554     308s     277s        0.90
  #     4     1023     308s     181s        0.59
  #     5      667     308s     153s        0.50
  #
  # 1.82x real spread against a self-scored prediction of 1.01x. Sharding the
  # harvest measures each test in the same short-process context it will run in.
  #
  # It is ALSO why this stays out of test.yml: harvesting there would put an
  # artifact upload on the run whose conclusion gates production deploys.
  harvest:
    name: Harvest shard ${{ matrix.group }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ⚠ Must equal test.yml's backend-shard matrix. Fenced by
        # backend/tests/test_ci_shard_config.py.
        group: [1, 2, 3, 4, 5, 6]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Harvest this shard's durations
        working-directory: backend
        env:
          TEST_REAL_REDIS_URL: redis://localhost:6379/0
        # ⚠ `--clean-durations` is LOAD-BEARING here, not cosmetic. Without it
        # PytestSplitCachePlugin merges this shard's fresh values on top of the
        # whole committed file, so every artifact would carry all 4000+ entries
        # and a naive merge would overwrite fresh values with stale ones --
        # silently producing a file that looks regenerated and is not. With it,
        # each artifact holds ONLY this shard's tests and the six are disjoint
        # by construction.
        #
        # The incoming split shape does not need to be correct: it only decides
        # WHICH tests this shard measures, not how fast they are. Even a badly
        # balanced input converges, because every test is timed in a short
        # process either way.
        run: >-
          pytest --splits ${{ strategy.job-total }} --group ${{ matrix.group }}
          --store-durations --clean-durations --durations-path .test_durations

      - name: Upload this shard's durations
        uses: actions/upload-artifact@v4
        with:
          name: durations-shard-${{ matrix.group }}
          path: backend/.test_durations
          # ⚠ `.test_durations` is a DOTFILE and upload-artifact >= 4.4.0 drops
          # hidden files by default EVEN WHEN NAMED (actions/upload-artifact#602).
          # Without this the step fails after the suite has already run.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  merge:
    name: Regenerate test durations
    runs-on: ubuntu-latest
    needs: harvest
    steps:
      - name: Download every shard's durations
        uses: actions/download-artifact@v4
        with:
          pattern: durations-shard-*
          path: shards

      - name: Merge, asserting the shards are disjoint
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          parts = sorted(pathlib.Path("shards").glob("*/.test_durations"))
          if not parts:
              sys.exit("no shard artifacts were downloaded")
          print(f"merging {len(parts)} shard artifact(s)")

          merged: dict[str, float] = {}
          for part in parts:
              data = json.loads(part.read_text())
              # ⚠ Disjointness is the property --clean-durations buys us, and
              # asserting it is what makes the pytest-split pin safely
              # upgradeable: if a future version changes those semantics, this
              # fails loudly instead of quietly emitting a half-stale file.
              overlap = merged.keys() & data.keys()
              if overlap:
                  sys.exit(
                      f"{part} overlaps an earlier shard on {len(overlap)} keys, "
                      f"e.g. {sorted(overlap)[:3]}. --clean-durations is not "
                      "doing what this merge assumes."
                  )
              print(f"  {part.parent.name}: {len(data)} entries, {sum(data.values()):.1f}s")
              merged.update(data)

          if len(merged) < 3000:
              sys.exit(f"merged only {len(merged)} entries; expected the whole suite")

          # ⚠ 6dp, NOT 3dp, and this is fenced -- do not "tidy" it.
          #
          # Rounding shortens an otherwise unreadable float repr
          # (0.00017587500042282045). But at 3dp every sub-millisecond test
          # collapses onto the same few values: measured, a real harvest drops
          # to 824 distinct values out of 4181 (19.7%), which trips
          # test_recorded_durations_are_not_degenerate -- the fence whose job is
          # to notice a SYNTHESISED file. 6dp keeps 84.9% distinct at a max
          # error of 5e-7s (about 2ms across the whole ~1300s suite, i.e.
          # nothing), so both properties hold.
          #
          # If that fence ever goes red, do not lower its threshold to match a
          # coarser rounding here. Raise the precision.
          merged = {k: round(v, 6) for k, v in merged.items()}
          out = pathlib.Path("backend/.test_durations")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(merged, indent=4, sort_keys=True) + "\n")
          print(f"\nmerged: {len(merged)} entries, {sum(merged.values()):.1f}s")
          PY

      - name: Upload the regenerated durations file
        uses: actions/upload-artifact@v4
        with:
          name: test-durations
          path: backend/.test_durations
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
