name: Test

# NO `paths:` FILTER, DELIBERATELY (TBD-347). Do not reintroduce one.
#
# `Backend Checks` and `Frontend Checks` are REQUIRED status checks on `main`.
# A required context that never reports blocks its PR forever on "Expected —
# waiting for status to be reported", so any path filter here turns a
# docs-only PR into a permanently unmergeable one. Measured before this
# change: 4 of the last 12 merged PRs (#631, #638, #639, #640 — all
# docs/specs-only) carried ZERO GitHub Actions check-runs and would have been
# stuck.
#
# The filter previously existed to conserve Actions minutes. This repository
# is PUBLIC, where GitHub-hosted standard runners are free and unmetered, so
# it was saving nothing. The cost of removing it is ~8 minutes of wall clock
# on the minority of PRs that touch no code.
#
# The rejected alternative — a mirrored `paths-ignore` workflow whose jobs
# carry identical `name:` strings and `exit 0` — requires two hand-maintained
# lists to stay exact inverses forever. The first drift makes a PR match both,
# two runs report the same context name, and a real red suite can be
# overwritten by the stub. That is this repo's half-fix-leaves-a-door pattern
# with the door installed on purpose.
#
# ⚠ IN-WORKFLOW CHANGE DETECTION IS THE SANCTIONED ALTERNATIVE (TBD-404). The
# `changes` job below diffs the PR against its merge base and every work job is
# gated on its per-area output, so a docs-only PR skips the six backend shards,
# `Migration Checks` and the frontend suite. That is NOT the banned filter, and
# the difference is exactly the property the ban protects: every job still
# STARTS and then decides to do nothing, so both required contexts always
# report and the `Test` run always CONCLUDES. That is what keeps a docs-only PR
# mergeable, and what keeps `scripts/ci/await-test-run.sh` -- and therefore
# production deploys -- terminating on every push to `main`. A trigger-level
# `paths:` filter would stop the jobs existing at all, which breaks both.
on:
  pull_request:
  # Post-merge run on `main`. This is the deliberate substitute for branch
  # protection's `strict: true` (which would force every PR up-to-date and
  # serialize merges behind a full ~8-minute re-run). Two PRs can each be
  # green in isolation and conflict semantically once both land; no PR check
  # can see that. This makes it visible within one run of the merge instead.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # INFRA-42: `main` runs are keyed by sha. A concurrency group holds at most
  # ONE pending run and cancels the older pending one even with
  # `cancel-in-progress: false`, so a shared `main` group dropped a merge's run
  # in a burst of three. Every `main` commit needs its own run: it builds the
  # sha-<7> images that a release later promotes, and release.yml's
  # await-tests waits for exactly that run's conclusion.
  group: test-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  # ⚠ PR runs cancel their own superseded runs; `main` runs MUST NOT.
  # Before INFRA-42 every post-merge run shared the `refs/heads/main` group,
  # and with a blanket `cancel-in-progress: true` each merge cancelled the
  # previous merge's run —
  # measured burst: four merges inside fifteen minutes on 2026-08-09 — so the
  # conflict introduced by merge N is cancelled by merge N+1 and never
  # reported. That silently defeats the `push:` trigger above in exactly the
  # conditions it exists for.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Change detection (TBD-404) ───────────────────────────────────────────
  # Emits the per-area booleans that gate every work job below. Read the
  # header of this file first: this is the sanctioned alternative to the
  # permanently banned trigger-level `paths:` filter, and the reason it is
  # allowed is that the jobs still start.
  #
  # No third-party action, deliberately. These outputs gate two REQUIRED
  # status checks, so a marketplace action here would put an unpinned
  # third-party supply chain on the repo's merge gate. `git diff` is enough.
  #
  # The classification rules and every fail-safe branch live in
  # scripts/ci/detect-changed-areas.sh and are fenced by
  # backend/tests/test_ci_change_detection.py.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      migrations: ${{ steps.detect.outputs.migrations }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # ⚠ Load-bearing. The default depth-1 clone does not contain the PR's
          # base commit, so the diff would fail — and the detector fails SAFE
          # (every area true), so the symptom would not be a red build but a
          # silent "scoping never does anything".
          fetch-depth: 0

      - name: Detect changed areas
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Empty on `push` and `workflow_dispatch`. The detector reports
          # everything as changed for those events before it ever reads this.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/detect-changed-areas.sh

  # Backend pytest is sharded across N parallel groups via pytest-split.
  # Each shard runs a deterministic, duration-balanced slice of the suite
  # using the recorded backend/.test_durations file.
  #
  # ⚠ The original "<3 minute backend check" target is RETIRED (TBD-421). A
  # run's wall clock is set by its slowest job, so backend time below that job
  # is unobservable. At TBD-421 the slowest job was `Frontend Checks` (~347s)
  # and the target became "`Backend Checks` stays below `Frontend Checks`".
  # That target is already missed: as of 2026-09-13 Backend Shard 5/6 (~470s)
  # is the slowest job, ahead of the frontend suite (~400s) and the other
  # shards (~220-375s). The shard-5 imbalance is tracked as TBD-524.
  #
  # See specs/2026-08-19-ci-shard-rebalance.md for the current rationale, and
  # specs/ci-test-sharding.md for the original audit (superseded on the shard
  # count and the target; still accurate on why pytest-split over xdist).
  #
  # The suite is self-contained: tests use in-process aiosqlite + a fake
  # Redis (see backend/tests/conftest.py), so shards need NO MySQL and the
  # fake covers the whole suite. The ONE exception is the reuse-detection
  # real-Lua regression tests (tests/auth/test_session_reuse_detection.py),
  # which must execute the shipped DETECT_REUSE_LUA against a real server to
  # catch a Lua-string bug the fake would mask. We give each shard a Redis
  # service and expose it ONLY via TEST_REAL_REDIS_URL (a dedicated var, not
  # REDIS_URL) so those opt-in tests run while the rest of the suite and the
  # app's rate-limiter config stay on the fake / in-memory path unchanged.
  #
  # The allowlist regression (tests/auth/test_sessions_invalidated_at_allowlist.py)
  # AST-scans backend/app/ source, not test files, so it works correctly in
  # whichever single shard pytest-split assigns it to — no replication needed.
  # ⚠ THE SHARD COUNT IS DERIVED, NOT WRITTEN OUT. Change `matrix.group` and
  # nothing else; the job name and `--splits` both read `strategy.job-total`.
  #
  # It used to be spelled literally in three places (job name, matrix, and
  # `--splits`). A matrix LARGER than `--splits` is loud -- pytest-split raises
  # UsageError. A matrix SMALLER than `--splits` is SILENT TOTAL LOSS: with
  # `--splits 6` and `group: [1,2,3,4]`, one third of the suite never runs and
  # every check stays green. backend/tests/test_ci_shard_config.py fences the
  # invariant for anyone who reverts to literals.
  #
  # Six, not eight (TBD-421): shards were sized against the then-slowest job,
  # `Frontend Checks` (~347s), since a shard faster than the slowest job buys
  # no wall clock. Six was bought for headroom rather than speed. ⚠ By
  # 2026-09-13 shard 5/6 (~470s) had become the slowest job itself (TBD-524).
  # A full run peaks at 9 concurrent jobs (8 before TBD-422 split the frontend
  # suite), so two concurrent PRs peaked at 18 of the 20 public runners. Eight
  # shards would put them over that budget, and queueing costs more than the
  # extra shard saves. ⚠ INFRA-42 added the three Publish Image jobs (short,
  # cached builds): a full run now peaks at 12, so two full PRs at once queue
  # a few jobs.
  backend-shard:
    name: Backend Shard ${{ matrix.group }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    needs: changes
    # TBD-404: skipped entirely when no backend-relevant file changed. The
    # `Backend Checks` aggregate accepts that skip ONLY because
    # `needs.changes.outputs.backend` says `false` — see scripts/ci/assert-gate.sh.
    if: ${{ needs.changes.outputs.backend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    services:
      # Only the reuse-detection real-Lua tests use this, via TEST_REAL_REDIS_URL
      # below; the rest of the suite runs on the in-process fake Redis.
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run backend tests (shard ${{ matrix.group }}/${{ strategy.job-total }})
        working-directory: backend
        env:
          # Dedicated var (NOT REDIS_URL) so only the opt-in real-Lua
          # reuse-detection tests use real Redis; app config stays unchanged.
          TEST_REAL_REDIS_URL: redis://localhost:6379/0
          # Per-shard coverage data file, combined by the `backend` aggregate
          # below (TBD-498). Six shards writing the default `.coverage` would
          # clobber each other; this keeps each shard's data file distinct.
          COVERAGE_FILE: .coverage.${{ matrix.group }}
          # INFRA-53: coverage is main-only; PR shards skip it (nothing reads it there).
          COV_FLAGS: ${{ github.event_name != 'pull_request' && '--cov=app --cov-report=' || '' }}
        run: pytest --splits ${{ strategy.job-total }} --group ${{ matrix.group }} --durations-path .test_durations $COV_FLAGS

      - name: Run backend syntax smoke
        if: ${{ matrix.group == 1 }}
        run: python -m compileall backend/app

      # Uploaded so the `backend` aggregate can combine all six shards into
      # one number — a per-shard `--cov` figure is a slice, not a number
      # (TBD-498). `include-hidden-files` is required: the data file is a
      # dotfile and `upload-artifact@v4` skips those by default, silently.
      # This `if:` must match COV_FLAGS's condition above: a mismatch either
      # way makes `if-no-files-found: error` turn shards red, and on main that
      # blocks the deploy (INFRA-53).
      - name: Upload shard coverage data
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.group }}
          path: backend/.coverage.${{ matrix.group }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # TBD-561 (F-M6): the MCP server component ships from its own image. Build
  # backend/Dockerfile.mcp and import app.mcp_main INSIDE it, so a tool that
  # starts importing (at module load) a package the image excludes (alembic,
  # ofxtools, pyotp, qrcode) fails here, not at deploy. The pin-parity half is a backend test.
  # Throwaway secrets: Settings refuses to import without real-looking ones.
  # Nothing is pushed: no consumer of a registry image exists yet.
  mcp-image:
    name: MCP Image
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build the MCP image
        run: docker build -f backend/Dockerfile.mcp -t "tbd-mcp:${GITHUB_SHA}" backend

      - name: Import the MCP app inside the image
        run: >-
          docker run --rm
          -e JWT_SECRET_KEY="$(openssl rand -hex 32)"
          -e MFA_RECOVERY_HMAC_KEY="$(openssl rand -hex 32)"
          "tbd-mcp:${GITHUB_SHA}"
          python -c "import sys, app.mcp_main; assert 'app.main' not in sys.modules; print('mcp import ok')"

  # INFRA-39: backend/Dockerfile ships two targets (prod, migrations). Build
  # both, prove the runtime has no build toolchain, and import the app and the
  # alembic entrypoint inside them. Nothing is pushed yet.
  backend-image:
    name: Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build the prod target
        run: docker build --target prod -t "tbd-backend:${GITHUB_SHA}" backend

      - name: Build the migrations target
        run: docker build --target migrations -t "tbd-migrations:${GITHUB_SHA}" backend

      - name: No build toolchain in either runtime image
        run: |
          for img in tbd-backend tbd-migrations; do
            docker run --rm --entrypoint sh "$img:${GITHUB_SHA}" -c '! command -v gcc && ! command -v pkg-config'
          done

      - name: Targets keep their CMD, and a plain build is prod
        run: |
          docker build -t "tbd-default:${GITHUB_SHA}" backend
          docker inspect -f '{{index .Config.Cmd 0}}' "tbd-default:${GITHUB_SHA}" | grep -x uvicorn
          docker inspect -f '{{.Config.User}} {{.Config.ExposedPorts}} {{.Config.WorkingDir}}' "tbd-default:${GITHUB_SHA}" | grep -Fx 'backend map[8000/tcp:{}] /app'
          docker inspect -f '{{json .Config.Cmd}}' "tbd-migrations:${GITHUB_SHA}" | grep -Fx '["python","/app/scripts/migrate.py"]'

      - name: Import the app inside the prod image
        run: >-
          docker run --rm
          -e JWT_SECRET_KEY="$(openssl rand -hex 32)"
          -e MFA_RECOVERY_HMAC_KEY="$(openssl rand -hex 32)"
          "tbd-backend:${GITHUB_SHA}"
          python -c "import app.main; print('backend import ok')"

      - name: Import the migration runner inside the migrations image
        run: >-
          docker run --rm
          -e JWT_SECRET_KEY="$(openssl rand -hex 32)"
          -e MFA_RECOVERY_HMAC_KEY="$(openssl rand -hex 32)"
          "tbd-migrations:${GITHUB_SHA}"
          python -c "import alembic, scripts.migrate; print('migrations import ok')"

  # INFRA-42: the GHCR images, through the shared build-image workflow
  # (RELEASE_CONTRACT.md section 3). Pull requests build without pushing; a
  # push to `main` publishes sha-<7>, which release.yml's promote retags as
  # vX.Y.Z and never rebuilds. detect-changed-areas.sh reports every area as
  # changed on any non-PR event, so every `main` commit (the release-please
  # commit included) gets all three images.
  backend-images:
    name: Publish Image (${{ matrix.image }})
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    strategy:
      matrix:
        include:
          - { image: backend, target: prod }
          - { image: migrations, target: migrations }
    permissions:
      contents: read
      packages: write
    uses: fjcloudaiconsulting/.github/.github/workflows/build-image.yml@v1
    with:
      image: ${{ matrix.image }}
      context: backend
      target: ${{ matrix.target }}

  frontend-image:
    name: Publish Image (frontend)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: fjcloudaiconsulting/.github/.github/workflows/build-image.yml@v1
    with:
      image: frontend
      context: frontend

  # Stable aggregate gate. Branch protection / required-check config can
  # point at this single "Backend Checks" context; it passes only when
  # every shard passed. Keeping the name "Backend Checks" preserves the
  # pre-sharding status-check semantics even though the work now fans out.
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    needs: [changes, backend-shard, migrations, mcp-image, backend-image, backend-images]
    if: ${{ always() }}
    steps:
      # ⚠ THE WIRING GUARD MUST STAY THE FIRST STEP IN THIS JOB.
      # This job is `if: always()`. If the guard sat after the shard-result
      # `exit 1` below, a failing shard would mask a wiring failure and the
      # guard would only ever run on already-green builds.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Only `Backend Checks` and `Frontend Checks` are required contexts on
      # `main`. So a new top-level job added to this file WITHOUT wiring it
      # into this aggregate's `needs:` reports an unrequired context: it goes
      # red and the PR merges anyway. That is TBD-347's own defect at smaller
      # scale, and worse than the original because by then CI is believed to
      # be a floor.
      #
      # The fold-in convention (see the `Migration Checks` note below) was
      # previously held by a comment. This turns it into a test.
      - name: Verify every job in this workflow is wired into this gate
        run: |
          pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, sys, yaml

          # Jobs that ARE the gates, so they cannot depend on themselves.
          ALLOWLIST = {"backend", "frontend"}

          doc = yaml.safe_load(
              pathlib.Path(".github/workflows/test.yml").read_text()
          )
          jobs = set(doc["jobs"])

          # Positive baseline. Without this, a wrong path or a swallowed parse
          # error yields an empty set and "no unwired jobs" passes vacuously —
          # the unreachable-predicate class this repo has shipped before.
          assert len(jobs) >= 6, f"parsed only {len(jobs)} job(s); expected >= 6"
          assert "migrations" in jobs, f"did not find `migrations` in {sorted(jobs)}"
          assert "changes" in jobs, f"did not find `changes` in {sorted(jobs)}"

          # Pin the allowlist itself. Otherwise the trivially-available fix for
          # a red guard is to widen the allowlist, which re-opens the hole
          # behind a green check. Widening it must be a deliberate two-place
          # edit, not a reflex.
          assert ALLOWLIST == {"backend", "frontend"}, (
              f"allowlist was widened to {sorted(ALLOWLIST)}. Wire the new job "
              "into `needs:` instead — the allowlist is only for the gates."
          )

          # Read `needs:` off the parsed YAML, never a hardcoded copy. A copy
          # is a second source of truth that drifts and re-creates the defect
          # inside the fix.
          #
          # ⚠ TBD-404: this is the UNION of BOTH gates' `needs`, not just
          # `backend`'s. `Frontend Checks` is now an aggregate too, and its
          # work job (`frontend-work`) is wired into IT, not into `backend`.
          # Requiring every job to hang off `backend` would force the frontend
          # suite to gate the backend context and vice versa.
          #
          # This is NOT an allowlist widening and must not be mistaken for one.
          # The allowlist below still names only the two gate jobs — the jobs
          # that cannot depend on themselves. The union changes which `needs:`
          # lists count as "wired", and the invariant is unchanged: every job
          # in this file must be depended on by a REQUIRED context.
          needs = set()
          for gate in sorted(ALLOWLIST):
              needs |= set(doc["jobs"][gate].get("needs") or [])
          unwired = sorted(jobs - (needs | ALLOWLIST))

          if unwired:
              print(f"Job(s) not wired into a required gate: {unwired}")
              print("Add them to `jobs.backend.needs` or `jobs.frontend.needs`")
              print("and assert their result with scripts/ci/assert-gate.sh, or")
              print("they will report an unrequired context and merge red.")
              sys.exit(1)

          print(f"All {len(jobs)} jobs are wired into a required gate.")
          PY

      # ⚠ THE ACCEPT RULE LIVES IN scripts/ci/assert-gate.sh, NOT HERE.
      # A `skipped` upstream means EITHER "its `if:` was false, nothing to
      # test" OR "an upstream job failed", and `needs.<job>.result` cannot tell
      # them apart. So the accept is conditional on the change-detection output
      # for that area, and on nothing else. Inlining that comparison here would
      # give the rule two implementations and one fence.
      # Fenced by backend/tests/test_ci_gate_accept_rule.py.
      #
      # The detector itself has no area of its own, so it is asserted with a
      # literal `true`, which reduces the rule to "only `success` passes" —
      # exactly right for a job that must always run. Without this, a failed
      # `changes` job would leave every output empty, skip every work job, and
      # the whole suite would ride on the empty-string branch alone.
      - name: Verify change detection ran
        run: bash scripts/ci/assert-gate.sh "${{ needs.changes.result }}" "true" "Change detection"

      - name: Verify all backend shards passed
        run: >-
          bash scripts/ci/assert-gate.sh
          "${{ needs.backend-shard.result }}"
          "${{ needs.changes.outputs.backend }}"
          "Backend shards"

      - name: Verify the MCP image built and imported
        run: >-
          bash scripts/ci/assert-gate.sh
          "${{ needs.mcp-image.result }}"
          "${{ needs.changes.outputs.backend }}"
          "MCP Image"

      - name: Verify the backend image targets built
        run: >-
          bash scripts/ci/assert-gate.sh
          "${{ needs.backend-image.result }}"
          "${{ needs.changes.outputs.backend }}"
          "Backend Image"

      - name: Verify the backend and migrations images built (and published on main)
        run: >-
          bash scripts/ci/assert-gate.sh
          "${{ needs.backend-images.result }}"
          "${{ needs.changes.outputs.backend }}"
          "Publish backend images"

      # `Migration Checks` is folded into this aggregate deliberately. It is
      # the one context branch protection is expected to require (TBD-347),
      # and a MySQL-only defect merging green because someone forgot to add a
      # second context name would reinstate exactly the hole that job exists
      # to close. Keeping one gate name means TBD-347 needs no new entry.
      - name: Verify migrations passed
        run: >-
          bash scripts/ci/assert-gate.sh
          "${{ needs.migrations.result }}"
          "${{ needs.changes.outputs.migrations }}"
          "Migration Checks"

      # ── Coverage reporting (TBD-498) ─────────────────────────────────────
      # Deliberately AFTER the gate assertions above: this is reporting, not
      # gating, and `continue-on-error: true` below means it must never be
      # able to influence whether this required context passes.
      #
      # PR runs skip this block (INFRA-53): shards run without --cov, so there
      # is nothing to combine.
      #
      # Six shards ran with `--cov`; a single shard's figure is a slice, not
      # a number, so the six `.coverage.<group>` data files are combined here
      # into one report. No coverage threshold and no badge — measure first,
      # look at the real numbers before advertising anything on a public
      # README.
      - name: Download shard coverage data
        if: ${{ needs.changes.outputs.backend == 'true' && github.event_name != 'pull_request' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: cov

      - name: Set up Python for coverage combine
        if: ${{ needs.changes.outputs.backend == 'true' && github.event_name != 'pull_request' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Combine shard coverage and report
        if: ${{ needs.changes.outputs.backend == 'true' && github.event_name != 'pull_request' }}
        continue-on-error: true
        run: |
          pip install coverage==7.6.10
          mkdir -p cov && cd cov
          find . -name '.coverage.*' -exec mv {} . \; 2>/dev/null || true
          coverage combine --rcfile=/dev/null . || true
          {
            echo "## Backend coverage"
            echo '```'
            coverage report --rcfile=/dev/null 2>&1 | tail -25 || echo "no data"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # TBD-500: publish the NUMBER ONLY to a shields.io gist endpoint. Never on
      # a PR -- the badge tracks `main`. Fails soft in the script as well as
      # here: a badge must never fail a required check.
      - name: Publish backend coverage badge
        if: ${{ needs.changes.outputs.backend == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          cd cov
          PCT=$(coverage report --rcfile=/dev/null 2>/dev/null | tail -1 | awk '{print $NF}' | tr -d '%')
          cd ..
          ./scripts/ci/update-coverage-badge.sh backend "$PCT"

  # ── Migration Checks (TBD-212) ───────────────────────────────────────────
  # The ONLY place CI executes migrations against MySQL 8.
  #
  # Every job above runs on in-process aiosqlite (see the shard note). That is
  # deliberate and fast, but it means a MySQL-only defect reaches `main` with
  # every check green. Not hypothetical: TBD-322 was a live
  # production auth bypass caused by MySQL's utf8mb4_0900_ai_ci collation
  # being case-insensitive where Python's `startswith` is not, and states
  # plainly that "SQLite-backed CI structurally cannot see it". The
  # 2026-05-20 aiomysql outage was the same shape: a green suite, then every
  # DB-touching request 500ing in production.
  #
  # `tests/migrations/test_sqlite_portability.py` disclaims this coverage in
  # its own prose — the file-level ban there "is the appropriate guard, not a
  # full `alembic upgrade head` smoke run". This job is that smoke run.
  #
  # Scope limit, stated rather than implied: this drives `alembic` directly,
  # NOT `backend/scripts/migrate.py`, because that wrapper hardcodes
  # ALEMBIC_INI = "/app/alembic.ini" (an in-container absolute path) and
  # cannot run on a bare runner. The wrapper's per-revision structured events
  # are therefore NOT exercised here; only the migrations themselves are.
  migrations:
    name: Migration Checks
    runs-on: ubuntu-latest
    needs: changes
    # TBD-404: this job boots the whole app against real MySQL and hits
    # /ready, so its scope is every backend change, not just backend/alembic/.
    # `detect-changed-areas.sh` derives `migrations` from `backend` for that
    # reason; narrow it there, never by hand-wiring a different output here.
    if: ${{ needs.changes.outputs.migrations == 'true' }}
    # ⚠ Do not delete this job. The block above already explains why it is the
    # only real-MySQL coverage in CI; the live production auth bypass it exists
    # to catch was TBD-322.
    #
    # 8.0 was dropped from the matrix on 2026-08-20 (TBD-415): production cut
    # over to 8.4.11 on 2026-08-19 (TBD-360), and dev and CI are both mysql:8.4,
    # so the 8.0 leg covered an engine nothing runs.
    #
    # ⚠ The matrix SHAPE is kept deliberately even at one entry, so the job name
    # stays `Migration Checks` and the per-leg names keep their `(8.4)` suffix.
    # Collapsing to a plain job renames the check-runs.
    #
    # ⚠ Dropping the leg buys ZERO wall-clock. This job runs ~55s in parallel and
    # finishes minutes before the critical path; it was never on it. The saving
    # is runner-seconds on a public repo where they are free. This change is for
    # correctness — testing an engine nothing runs — and nothing else.
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.4"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: ci_root_secret
          MYSQL_DATABASE: pfv2
          MYSQL_USER: pfv2
          MYSQL_PASSWORD: pfv2_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci_root_secret --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql+aiomysql://pfv2:pfv2_secret@127.0.0.1:3306/pfv2
      # Throwaway values for a throwaway database. Only `JWT_SECRET_KEY` is
      # actually required — its default is a placeholder `app/config.py`
      # rejects outright. The other two are optional in a non-production
      # app_env (an empty MFA key is a supported no-op; the PAT key is
      # required only when app_env == "production"), but each validator
      # compares its key against `jwt_secret_key`, so when set they must
      # differ from it. Distinct values are given to keep that unambiguous.
      JWT_SECRET_KEY: ci-migration-smoke-jwt-key-not-a-real-secret
      MFA_RECOVERY_HMAC_KEY: ci-migration-smoke-mfa-key-distinct-01
      API_TOKEN_HMAC_KEY: ci-migration-smoke-pat-key-distinct-02
      # `app/main.py::_detect_branch` reads the absolute path /app/.git/HEAD,
      # which does not exist on a bare runner, so the lifespan migration guard
      # reads the branch as undetectable and fails CLOSED — aborting boot, not
      # skipping. Opting in is correct here and nowhere near the trap that
      # guard exists to prevent: this job owns a disposable service container,
      # not a shared developer volume.
      PFV_MIGRATE_OK_OFF_MAIN: "1"
      # ⚠ REQUIRED, and its absence is invisible to local testing.
      # `alembic/env.py` does `from app.models import Base`, and NOTHING here
      # puts `backend/` on sys.path: `alembic.ini` has no `prepend_sys_path`,
      # and `alembic` is a console script, so CPython sets sys.path[0] to the
      # script's bin directory rather than the cwd — `working-directory` does
      # not affect sys.path. In every container this works only because
      # `backend/Dockerfile` sets `ENV PYTHONPATH=/app`, which is exactly why
      # verifying these commands inside the backend container passes while a
      # bare runner would fail 100% of runs, on both the alembic steps and on
      # the lifespan's own `alembic` subprocess during the boot step.
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Guards the "from empty" claim. If a future change seeds the database
      # before this point, `upgrade head` would be exercising a partial path
      # and the job would silently stop testing what it says it tests.
      - name: Assert the database starts empty
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio, os
          import sqlalchemy as sa
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main():
              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.connect() as conn:
                  tables = (await conn.execute(sa.text("SHOW TABLES"))).fetchall()
              await engine.dispose()
              assert tables == [], f"expected an empty database, found {tables}"
              print("database is empty; upgrade head will run every revision")

          asyncio.run(main())
          PY

      - name: Run alembic upgrade head against MySQL 8
        working-directory: backend
        run: alembic upgrade head

      # `upgrade head` exiting 0 is necessary but not sufficient: it also
      # exits 0 when it applied nothing. Pin that the stamped revision is the
      # single head and that the core tables actually exist.
      - name: Assert the schema landed at head
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio, os
          import sqlalchemy as sa
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy.ext.asyncio import create_async_engine

          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          assert len(heads) == 1, f"expected exactly one alembic head, got {heads}"

          async def main():
              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.connect() as conn:
                  stamped = (
                      await conn.execute(sa.text("SELECT version_num FROM alembic_version"))
                  ).scalars().all()
                  tables = (await conn.execute(sa.text("SHOW TABLES"))).fetchall()
              await engine.dispose()
              assert stamped == list(heads), f"stamped {stamped}, expected {list(heads)}"
              names = {row[0] for row in tables}
              for required in ("users", "organizations", "transactions", "accounts"):
                  assert required in names, f"table {required!r} missing after upgrade head"
              print(f"schema at {stamped[0]} with {len(names)} tables")

          asyncio.run(main())
          PY

      # Deploys re-run migrations against an already-migrated database on
      # every release. A revision that is not idempotent fails here rather
      # than in production.
      #
      # ⚠ Do not delete this as redundant with the boot step below. It is true
      # that the boot step ALSO re-runs alembic (the lifespan's no-op
      # short-circuit reads the hardcoded /app/alembic.ini, which is absent on
      # a runner, so its head resolves to "unknown" and the skip can never
      # fire) — but that is an accident of the runner layout, not a contract.
      # This step is the one that states the property on purpose.
      - name: Re-run upgrade head (idempotency)
        working-directory: backend
        run: alembic upgrade head

      # Migrations applying is not the same as the app working against the
      # migrated schema on the real driver. This is the leg that would have
      # caught the 2026-05-20 aiomysql outage: /ready executes SELECT 1
      # through the app's own async engine.
      - name: Boot the app and assert /ready and /health/dependencies against MySQL
        working-directory: backend
        run: |
          # The redirect is load-bearing: it detaches uvicorn from the step's
          # stdout/stderr pipes, which is what stops the step hanging forever
          # on a backgrounded process.
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          code="000"
          for _ in $(seq 1 30); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:8000/ready || true)
            if [ "$code" = "200" ]; then
              echo "ready: $(cat /tmp/ready.json)"

              # ── TBD-413 ──────────────────────────────────────────────────
              # Asserted in THIS step, deliberately, not a following one: the
              # uvicorn above is backgrounded in this step's shell, and
              # whether an orphan survives into the next step is a runner
              # implementation detail this job should not depend on.
              #
              # This is the ONLY place in the system where a real uvicorn
              # boot, a real MySQL and a genuinely empty REDIS_URL coincide.
              # The pytest shards run in-process on aiosqlite with an autouse
              # fake Redis, so they cannot reach this state except by
              # hand-building it.
              #
              # ⚠ Deliberately NO REDIS_URL and no Redis service in this job.
              # This asserts the NON-PRODUCTION branch: an unconfigured Redis
              # is a supported mode outside production and must stay 200, or
              # this required gate goes red on every run.
              #
              # ⚠ PARSE the JSON, never grep the body — a grep for a key is
              # satisfied by a comment mentioning it. Assert the whole tuple:
              # a bare 200 check is near-vacuous, since a handler that always
              # returns 200 would pass it.
              dcode=$(curl -s -o /tmp/deps.json -w '%{http_code}' \
                http://127.0.0.1:8000/health/dependencies || true)
              echo "dependencies: $(cat /tmp/deps.json)"
              python - <<'PYCHECK'
          import json
          d = json.load(open("/tmp/deps.json"))
          assert d["status"] == "ok", d
          assert d["checks"]["database"] == "ok", d
          assert d["checks"]["redis"] == "disabled", d
          PYCHECK
              [ "$dcode" = "200" ] || {
                echo "expected 200 from /health/dependencies, got $dcode"
                exit 1
              }
              exit 0
            fi
            sleep 2
          done
          # curl prints 000 when it cannot connect at all, which is the usual
          # shape of a failed boot here.
          echo "backend never returned 200 from /ready (last code: $code)"
          echo "----- uvicorn log -----"
          cat /tmp/uvicorn.log
          exit 1

      # TBD-586 (R12, R16, R18). The platform reserve/settle race fences need a
      # real InnoDB: two connections, row locks, rowcount semantics. They live in
      # tests/services/test_platform_reserve_mysql.py and are not run anywhere
      # else. This step runs them against the migrated database above.
      #
      # ⚠ MUST STAY THE LAST STEP of this job. The fixture only deletes what it
      # created, but a step after it would still be running against a database
      # other tests have touched.
      # ⚠ REQUIRED=1 turns the module's missing-URL guard into a collection
      # failure, and the `^SKIPPED` check below fails the step if any test in
      # the file did not run (`-rs` prints one such line per test): a collected
      # race fence that did not execute is a silent hole, not a pass.
      # ⚠ `set -o pipefail`: `pytest | tee` would otherwise report tee's exit.
      - name: Run the platform reserve fences against MySQL
        working-directory: backend
        env:
          PLATFORM_RESERVE_MYSQL_URL: ${{ env.DATABASE_URL }}
          PLATFORM_RESERVE_MYSQL_REQUIRED: "1"
        run: |
          set -o pipefail
          python -m pytest tests/services/test_platform_reserve_mysql.py -q -rs -p no:cacheprovider 2>&1 | tee /tmp/platform-reserve.log
          if grep -q '^SKIPPED' /tmp/platform-reserve.log; then
            echo "a platform reserve fence did not run"
            exit 1
          fi


  # ── Frontend (TBD-404, TBD-422) ──────────────────────────────────────────
  # SPLIT INTO WORK + AGGREGATE, deliberately.
  #
  # `Frontend Checks` is a REQUIRED status check. If the required job were
  # itself the conditional one, a docs-only PR would skip it — and branch
  # protection reads a SKIPPED required check as PASSING. That is
  # indistinguishable from "skipped because an upstream failed", which is the
  # exact confusion scripts/ci/assert-gate.sh exists to resolve, except that
  # nothing would even get to run the rule. So the required name stays on an
  # aggregate that always runs, and the work moves to `frontend-work`.
  #
  # `Backend Checks` already had this shape (it aggregates the shards); this
  # brings the frontend side to the same shape rather than inventing a second
  # one.
  #
  # TBD-422: the work is TWO parallel jobs. `frontend-work` runs the vitest
  # suite (~69% of the old single job's time); `frontend-static` runs the
  # static checks and both builds. The old single job took ~399s median over 20
  # runs; the suite alone is ~281s and static + builds ~115s. ⚠ This shortens
  # frontend-only PRs only: on a full run the slowest job is Backend Shard 5/6
  # (~470s, TBD-524), so wall clock is unchanged until that shard is rebalanced.
  # ⚠ Both builds stay together in `frontend-static`: build-apex.sh MOVES files
  # out of `app/` for its duration, so it must never share a checkout with
  # vitest, and the out-apex checks read that build's output.
  frontend-work:
    name: Frontend Suite
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      # pnpm version comes from packageManager in frontend/package.json.
      - name: Enable pnpm
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # INFRA-54: coverage is main-only, like the backend (INFRA-53). PRs run
      # `test:nocov` (same act-guard reporter and judge, no --coverage); nothing
      # reads PR coverage (no threshold). The badge step below is main-only and
      # greps the coverage summary, so main must keep running `pnpm test`.
      - name: Run frontend tests
        working-directory: frontend
        env:
          TEST_SCRIPT: ${{ github.event_name == 'pull_request' && 'test:nocov' || 'test' }}
        run: pnpm run "$TEST_SCRIPT" | tee /tmp/fe-test.log; exit ${PIPESTATUS[0]}

      # TBD-500: as above, number only, `main` pushes only, fails soft.
      # ⚠ `exit ${PIPESTATUS[0]}` on the step above is load-bearing: piping into
      # tee would otherwise report tee's exit code and turn a red suite green.
      - name: Publish frontend coverage badge
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          PCT=$(grep -m1 '^Statements' /tmp/fe-test.log | grep -oE '[0-9]+\.?[0-9]*%' | head -1 | tr -d '%')
          ./scripts/ci/update-coverage-badge.sh frontend "$PCT"

  frontend-static:
    name: Frontend Static Checks
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      # pnpm version comes from packageManager in frontend/package.json.
      - name: Enable pnpm
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check design tokens
        working-directory: frontend
        run: bash scripts/check-design-tokens.sh

      - name: Run frontend lint
        working-directory: frontend
        run: pnpm lint --quiet

      # `next build` type-checks only what it bundles, so a type error in a
      # test file merged green before this (TBD-516: #761 + #762, fixed #763).
      - name: Type-check frontend
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Run frontend production build
        working-directory: frontend
        run: pnpm build

      - name: Run apex static export build
        working-directory: frontend
        env:
          TBD_BUILD_TARGET: apex
          TBD_SITE_URL: https://thebetterdecision.com
          TBD_APP_URL: https://app.thebetterdecision.com
        run: |
          pnpm build:apex
          # Belt-and-suspenders sanity: the build script's own trap should
          # have already cleared out-apex/ failures, but verify the
          # entry points landed before signaling green to the PR.
          test -f out-apex/index.html
          test -f out-apex/_meta.json

  # Stable aggregate gate for the frontend, mirroring `Backend Checks`. This
  # job — not `frontend-work` — is the required context on `main`, and it runs
  # unconditionally so the context always reports.
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: [changes, frontend-work, frontend-static, frontend-image]
    if: ${{ always() }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Same rule, same script, same fence as the backend aggregate. See the
      # comment block there for why the accept is conditional and why it is
      # not written inline.
      - name: Verify change detection ran
        run: bash scripts/ci/assert-gate.sh "${{ needs.changes.result }}" "true" "Change detection"

      - name: Verify the frontend suite passed
        run: >-
          bash scripts/ci/assert-gate.sh
          "${{ needs.frontend-work.result }}"
          "${{ needs.changes.outputs.frontend }}"
          "Frontend suite"

      - name: Verify frontend static checks and builds passed
        run: >-
          bash scripts/ci/assert-gate.sh
          "${{ needs.frontend-static.result }}"
          "${{ needs.changes.outputs.frontend }}"
          "Frontend static checks"

      - name: Verify the frontend image built (and published on main)
        run: >-
          bash scripts/ci/assert-gate.sh
          "${{ needs.frontend-image.result }}"
          "${{ needs.changes.outputs.frontend }}"
          "Publish frontend image"
