# Release orchestrator for main (INFRA-42: release-please).
#
# Every push to main runs this. `release` runs release-please with the Release
# GitHub App token: on an ordinary merge it opens or updates the release PR
# and nothing ships; on the merge of that release PR it tags vX.Y.Z on the
# release commit and publishes the GitHub Release (`release_created`). Only
# then do the gated jobs run: `promote` retags the release commit's sha-<7>
# GHCR images (built by test.yml, never rebuilt) as vX.Y.Z, `release-smoke`
# boots those images (compose.smoke.yaml), and `deploy` pushes .do/app.yaml
# to DO App Platform, which builds backend/ and frontend/ from main itself,
# followed by `smoke-tests` against production. deploy.yml stays the manual
# `workflow_dispatch` escape hatch for an infra-only change that must ship
# without a version.
#
# DO is gated on the release alone, not on promote/release-smoke: it builds
# from source, so a GHCR-side failure must not hold production back. That is
# today's coupling; INFRA-48 replaces the DO jobs with the cluster handoff.
#
# Why the gating job and not `on: release: { types: [published] }` on
# deploy.yml: one workflow keeps the "exactly one deploy per release" rule in
# one `if:` (fenced by backend/tests/test_deploy_workflow.py).

name: Release

on:
  push:
    branches: [main]
    # ⚠ NO `paths:` FILTER, DELIBERATELY (TBD-424 defect 2). Do not
    # reintroduce one -- not as `paths:`, and not as `paths-ignore:` either.
    #
    # Shippability is decided in ONE place: the owner merging the
    # release-please PR, which sets `release_created`, the condition on the
    # `deploy` job below. Every push must reach release-please, or the release
    # PR goes stale and the merged one is never tagged.
    #
    # ⚠ Do NOT replace it with in-workflow change detection either. test.yml's
    # `changes` job (scripts/ci/detect-changed-areas.sh) is VERDICT-NEUTRAL:
    # it fails TRUE on any uncertainty and can only ever add work. The same
    # detector here would be VERDICT-CHANGING: it could skip the run that
    # tags a merged release PR, a silent UNDER-release.

# Least privilege; each job that needs more says so. release-please itself
# writes with the Release App token, not GITHUB_TOKEN.
permissions:
  contents: read

# TBD-391. This workflow had NO concurrency group, so two merges landing close
# together ran two Release workflows at once and could push `.do/app.yaml` to
# DO out of order. That was already true; the `await-tests` gate below widens
# the window from seconds to ~8 minutes, which would turn a rare interleave
# into a likely one. Serialize, matching apex-deploy.yml.
#
# `cancel-in-progress: false` on purpose: a Release run that has already
# started may be mid-deploy, and cancelling it could leave DO half-rolled.
# A superseded pending run loses nothing: release-please reads main as it is
# when it runs, so the next run opens the release PR or tags a merged one.
concurrency:
  group: release-deploy
  cancel-in-progress: false

jobs:
  # TBD-391. THE INTERLOCK. See scripts/ci/await-test-run.sh for the measured
  # timings and the full reasoning.
  #
  # Placed before `release`, NOT between `release` and `deploy`: release-
  # please cuts an immutable git tag and publishes a GitHub Release (and under
  # semantic-release, on PR #654, that happened 7m41s before the post-merge
  # suite reported). Gating only
  # the deploy would still leave a published release for a commit whose suite
  # then goes red, permanently desynchronising the version line from what is
  # actually in production.
  #
  # This job produces no commit status and is not a required context, so no
  # failure mode here can block a PR from merging. It can only block a deploy,
  # and it always does so LOUDLY — a red run in the Actions tab, never a
  # silent no-ship.
  await-tests:
    name: Await post-merge tests
    runs-on: ubuntu-latest
    # Comfortably above the observed ~8m10s Test duration plus queueing. The
    # script's own 25m timeout fires first and prints the escape hatch.
    timeout-minutes: 30
    permissions:
      # ⚠ Job-level permissions REPLACE the workflow-level block, so this drops
      # `contents: write` for the wait. `actions: read` is REQUIRED to list
      # workflow runs — omit it and the API call 403s, the gate fails closed,
      # and deploys stop for a reason that looks exactly like a working gate.
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Wait for the Test workflow on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/ci/await-test-run.sh "${{ github.sha }}"

  release:
    name: Release PR and tag
    needs: await-tests
    runs-on: ubuntu-latest
    # Holds RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY. Branch `main` only, and
    # NO required reviewers: this job runs on every push to main.
    environment: release
    # Above await-test-run.sh's own 25 minute ceiling.
    timeout-minutes: 30
    permissions:
      contents: read
      # `gh pr list` and the Test run lookup.
      pull-requests: read
      actions: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Needed only for scripts/ci/await-test-run.sh below.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # ⚠ release-please acts on main as it is NOW, not on this commit: it tags
      # the merge commit of whichever release PR is merged and still labelled
      # `autorelease: pending`. If that commit is not this run's (a merge
      # landed on top, or the release commit's own run was dropped as a
      # superseded pending run), await-tests above proved nothing about it.
      # So wait for ITS Test run too, which is also the run that publishes the
      # sha-<7> images `promote` needs. Red or timed out: fail loudly, tag
      # nothing.
      - name: Await the tests of a merged release PR's commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shas=$(gh pr list --repo "$GH_REPO" --base main --state merged --label 'autorelease: pending' \
            --json mergeCommit --jq '.[].mergeCommit.oid')
          for sha in $shas; do
            if [ "$sha" = "$GITHUB_SHA" ]; then echo "release commit is this run's commit"; continue; fi
            ./scripts/ci/await-test-run.sh "$sha"
          done

      # An App token, not GITHUB_TOKEN, so the release PR triggers CI and can
      # satisfy the required checks (RELEASE_CONTRACT.md section 2).
      - name: Release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          # A tag on the release commit counts as creating its workflow files
          # when a later main commit changed one (INFRA-78).
          permission-workflows: write

      - name: release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Retag the release commit's sha-<7> images (test.yml built them on that
  # commit's push) as vX.Y.Z. Never rebuilds; fails if an image is missing.
  # Unlike ziftbook (one workflow), the image build is not a `needs` here: it
  # lives in test.yml, and the release job has already awaited that commit's
  # Test run, which includes the build.
  promote:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: fjcloudaiconsulting/.github/.github/workflows/promote-release.yml@v1
    with:
      version: ${{ needs.release.outputs.version }}
      images: backend frontend migrations

  # Boot the promoted vX.Y.Z images (compose.smoke.yaml): migrations twice,
  # then /health must report this version and the release commit.
  release-smoke:
    needs: [release, promote]
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: read
    uses: fjcloudaiconsulting/.github/.github/workflows/smoke.yml@v1
    with:
      version: ${{ needs.release.outputs.version }}
      health-url: http://localhost:8000/health

  deploy:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: read
      # await-test-run.sh lists workflow runs.
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Closes the seconds-wide window between the release job's
      # `gh pr list` and release-please's own query: a release PR merged in
      # between is tagged without its Test run awaited. Normally a no-op
      # (that run already passed); red means a failed deploy, which the
      # notifier below reports.
      - name: Await the tests of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          ./scripts/ci/await-test-run.sh "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"

      # ⚠⚠ Refuse to deploy if the committed spec would overwrite a live
      # secret. On 2026-08-20 exactly that took production's database and
      # redis credentials down (TBD-425); infra/MIGRATION.md step 9 had
      # warned about it since May and a runbook comment did not stop it.
      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Verify the committed spec will not overwrite live secrets
        env:
          APP_NAME: pfv
        run: |
          pip install --quiet pyyaml
          ./scripts/ci/assert-app-spec-secrets-synced.sh

      - name: Deploy to DigitalOcean App Platform
        uses: digitalocean/app_action/deploy@cc55bc9b848d25f9c1c9f831cf843fbab3fbfb15 # v2.0.11
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          # NOTE: Do NOT add `app_name` here. The v2 action's createSpec
          # logic (deploy/main.go) takes EITHER `app_name` OR
          # `app_spec_location`: with both set, it fetches the live spec
          # by name and ignores the file. Edits to .do/app.yaml then
          # silently never reach App Platform — that is the bug that let
          # PR #79's migration sit un-applied for hours after merge.
          # With only `app_spec_location`, the action reads the file and
          # picks up the app via its top-level `name:` field. .do/app.yaml
          # MUST list every secret with its encrypted EV[...] value, since
          # any SECRET not declared in this file gets removed from the
          # live app on push (we hit that exact failure mode 2026-04-25,
          # backend crashlooped on a placeholder JWT_SECRET_KEY).
          app_spec_location: .do/app.yaml

  # L0.5 — Post-deploy smoke tests. Runs only after `deploy` succeeds
  # so a failed deploy never reports as a smoke-test failure (the
  # `needs: deploy` gate plus our `on: push: branches: [main]` trigger
  # together guarantee this never runs on PRs or forks).
  #
  # Asserts the live app can serve traffic — DO marking the deploy
  # ACTIVE is necessary but not sufficient. See scripts/smoke-test.sh
  # for the surface and the smoke-user invariants (must exist, must be
  # email_verified, must NOT have MFA enabled).
  smoke-tests:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
      # Required by the failure-notification step below to open or
      # comment on a GitHub issue when the smoke job fails. Scoped to
      # this job only so the deploy job stays read-only.
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run smoke tests against production
        env:
          SMOKE_BASE_URL: https://app.thebetterdecision.com
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: ./scripts/smoke-test.sh

      - name: Notify on smoke failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: ./scripts/notify-smoke-failure.sh

  # TBD-424 defect 4 -- the "published but never DEPLOYED" alarm.
  #
  # `smoke-tests` above carries `needs: deploy`, so when `deploy` FAILS that
  # job is SKIPPED and notify-smoke-failure.sh never runs. The repo therefore
  # had a notifier for "deployed but not serving" and NONE AT ALL for "did not
  # deploy at all" -- the louder of the two, because it leaves a three-way
  # divergence: an immutable tag and GitHub Release published, a production
  # app still running PRE-tag code, and a `main` that matches neither. That
  # divergence is the signal. "The deploy failed" on its own is not: a failed
  # deploy that cut no tag leaves nothing inconsistent behind.
  #
  # ⚠ `always()` is required, or this job is skipped alongside its failed
  # upstream. `if: failure()` alone is NOT enough either: `deploy` can end
  # CANCELLED, which is not a failure. Cancelled stays deliberately IN scope
  # (there is no `!cancelled()` here) -- a deploy cancelled mid-push can leave
  # DO half-rolled with the tag already published, which is the loudest case.
  #
  # ⚠ It hangs off `release` + `deploy`, NEVER off `smoke-tests`. Depending on
  # the job that is skipped by the very condition being detected is precisely
  # the hole this closes.
  notify-undeployed-release:
    runs-on: ubuntu-latest
    needs: [release, deploy]
    # INFRA-42: also when the release job itself failed. release-please can
    # publish the GitHub Release and then fail (PR comment, relabel); the job
    # reports no `release_created`, `deploy` skips, and a re-run throws
    # DuplicateReleaseError, so that version would never reach DO silently.
    if: >-
      ${{ always()
          && ((needs.release.outputs.release_created == 'true'
               && needs.deploy.result != 'success')
              || needs.release.result == 'failure'
              || needs.release.result == 'cancelled') }}
    permissions:
      # ⚠ Job-level permissions REPLACE the workflow-level block (which grants
      # only `contents: read`), so `issues: write` must be spelled out here or
      # the notifier 403s at exactly the moment it is needed.
      #
      # `contents: write` is for the release annotation step below --
      # `gh release edit` writes a release, which lives under the `contents`
      # scope. With `contents: read` that step would 403 on every single run
      # and, being `continue-on-error`, would do so silently: a dead step that
      # looks alive. The issue step does not depend on it.
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # ⚠⚠ STEP ORDER IS LOAD-BEARING. The issue is opened FIRST so that a
      # failure to annotate the GitHub Release can never suppress the alert.
      # The annotation is cosmetic; the issue is the alarm.
      - name: Open or update the undeployed-release issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: ./scripts/notify-undeployed-release.sh

      # Best effort, and second on purpose. Demotes the published release to a
      # prerelease and banners its body so anyone reading the releases page
      # sees that this version corresponds to nothing in production.
      #
      # ⚠ The git TAG is never deleted. It is immutable by policy and other
      # things (changelogs, issue references, release-please's baseline) already point at it; deleting it would trade a visible
      # inconsistency for an invisible one.
      - name: Flag the published release as NOT DEPLOYED
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag_name }}
          RUN_ID: ${{ github.run_id }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -uo pipefail
          if [[ -z "${TAG:-}" ]]; then
            echo "No release tag on this run; nothing to annotate."
            exit 0
          fi
          RUN_URL="https://github.com/${GH_REPO}/actions/runs/${RUN_ID}"
          BANNER="> ⚠ **NOT DEPLOYED.** The \`deploy\` job for this release ended \`${DEPLOY_RESULT}\`, so production is still running PRE-\`${TAG}\` code and this tag corresponds to nothing deployed. See ${RUN_URL}."
          CURRENT="$(gh release view "$TAG" --repo "$GH_REPO" --json body --jq .body || true)"
          case "$CURRENT" in
            *"NOT DEPLOYED"*) echo "Release ${TAG} is already bannered."; exit 0 ;;
          esac
          printf '%s\n\n%s\n' "$BANNER" "$CURRENT" > /tmp/release-body.md
          gh release edit "$TAG" --repo "$GH_REPO" \
            --prerelease --notes-file /tmp/release-body.md
