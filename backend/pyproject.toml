[project]
name = "tbd-backend"
version = "0.0.0"
requires-python = "==3.12.*"
# Runtime deps live in dependency groups, not here, so the MCP image can install
# its subset (group `mcp`) without the rest. tests/mcp/test_mcp_image.py fences
# `mcp` as a same-pin subset of `app`.
dependencies = []

[dependency-groups]
app = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic[email]==2.11.3",
    "pydantic-settings==2.9.1",
    "sqlalchemy==2.0.41",
    "aiomysql==0.2.0",
    # PyMySQL is a transitive dep of aiomysql; pin explicitly because
    # SQLAlchemy's mysql dialect inspects PyMySQL's ``connect.__doc__`` to
    # decide whether to call ``ping()`` with or without an argument. A newer
    # PyMySQL whose docstring no longer contains the marker makes
    # ``AsyncAdapt_aiomysql_connection.ping()`` raise a TypeError. 1.1.3 is
    # known good against sqlalchemy==2.0.41 + aiomysql==0.2.0.
    "PyMySQL==1.1.3",
    "alembic==1.15.2",
    "PyJWT[crypto]==2.15.0",
    "bcrypt==4.3.0",
    "python-multipart==0.0.20",
    "structlog==25.1.0",
    "python-dateutil==2.9.0.post0",
    "httpx==0.28.1",
    "slowapi==0.1.9",
    "pyotp==2.9.0",
    "qrcode[pil]==8.0",
    "cryptography==44.0.3",
    "redis==5.2.1",
    "ofxtools~=0.9.5",
]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "pytest-split==0.10.0",
    "pytest-xdist==3.6.1",
    "pytest-cov==6.0.0",
    "aiosqlite==0.21.0",
]
# MCP server component (backend/Dockerfile.mcp): a subset of `app`, SAME pins.
# Excluded on purpose: alembic, ofxtools, pyotp, qrcode, python-multipart.
mcp = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic[email]==2.11.3",
    "pydantic-settings==2.9.1",
    "sqlalchemy==2.0.41",
    "aiomysql==0.2.0",
    "PyMySQL==1.1.3",
    "PyJWT[crypto]==2.15.0",
    "bcrypt==4.3.0",
    "structlog==25.1.0",
    "python-dateutil==2.9.0.post0",
    "httpx==0.28.1",
    "slowapi==0.1.9",
    "cryptography==44.0.3",
    "redis==5.2.1",
]

[tool.uv]
package = false
default-groups = ["app", "dev"]
