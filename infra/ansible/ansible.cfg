[defaults]
inventory = ./inventory.yml
host_key_checking = False
forks = 5
stdout_callback = default
callback_result_format = yaml
roles_path = ./roles
collections_path = ./collections
# TBD-419: apt_policy.py. `filter_plugins/` auto-loads next to the PLAYBOOK
# (playbooks/site.yml), not next to this file, so without this key the parser
# the MySQL track fence depends on silently never loads.
filter_plugins = ./filter_plugins
retry_files_enabled = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
