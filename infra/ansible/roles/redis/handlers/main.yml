---
# Restart is the heavy hammer: it drops every client connection (the App
# Platform backend's redis-py connection pool included), and dropped
# connections surface as "Redis: DOWN (timeout)" on the admin dashboard
# until the client pool heals. Reserve this for changes the running
# server cannot pick up live (bind address, port, requirepass).
- name: Restart redis
  ansible.builtin.service:
    name: redis-server
    state: restarted

# Apply the live-tunable knobs without dropping connections. CONFIG SET
# updates the running server; the drop-in /etc/redis/conf.d/10-tunables.conf
# is what makes the value survive a restart, because redis.conf includes it.
#
# ⚠⚠ THERE IS DELIBERATELY NO `CONFIG REWRITE` HERE. It used to be the last
# line of this handler, and it caused a production auth outage on 2026-08-19
# (TBD-412). CONFIG REWRITE persists the RUNNING configuration into the file
# Redis loaded from -- /etc/redis/redis.conf -- writing directives it did not
# previously contain at the END of that file. `include /etc/redis/conf.d/*.conf`
# is itself appended at EOF by the task in tasks/main.yml, so anything CONFIG
# REWRITE adds lands AFTER the include, and Redis takes the LAST directive it
# parses. The rewritten value therefore SHADOWS the drop-in this role manages.
#
# It was invisible for as long as it existed, because the shadowed value and
# the intended value were the same string. Rotating redis_password made them
# disagree: Redis kept authenticating with the old password while every client
# used the new one, and every session issue failed closed with a 503.
#
# The rewrite was never load-bearing. The drop-in already persists these four
# values across restarts, which is the entire job CONFIG REWRITE was doing.
#
# ⚠ EVERY REPLY IS CHECKED, because `redis-cli` EXITS 0 ON AUTH FAILURE.
# Measured: `redis-cli -a WRONGPASS --no-auth-warning ping` prints
# `NOAUTH Authentication required.` on STDOUT and returns 0; only the
# `AUTH failed` line goes to stderr. So `set -e` never trips, and this handler
# reported success while applying nothing at all -- the same silent-success
# shape that let TBD-412 hide for months. A CONFIG SET that worked replies
# exactly `OK`; anything else is a failure.
- name: Apply redis live tunables
  ansible.builtin.shell: |
    set -euo pipefail
    set_cfg() {
      out=$(redis-cli --no-auth-warning CONFIG SET "$1" "$2")
      [ "$out" = "OK" ] || { echo "CONFIG SET $1 -> $out" >&2; exit 1; }
    }
    set_cfg maxmemory "{{ redis_maxmemory }}"
    set_cfg maxmemory-policy "{{ redis_maxmemory_policy }}"
    set_cfg appendonly "{{ redis_appendonly }}"
    set_cfg appendfsync "{{ redis_appendfsync }}"
  args:
    executable: /bin/bash
  environment:
    REDISCLI_AUTH: "{{ redis_password }}"
  changed_when: true
