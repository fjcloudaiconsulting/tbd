---
# Override these in inventory.yml; vault-encrypt the passwords for real use.
mysql_app_db: pfv2
mysql_app_user: pfv_app
mysql_app_password: CHANGE_ME

# Dedicated user for nightly mysqldump and the migration runbook.
# root@localhost stays on Ubuntu's default socket-auth plugin; we don't
# manage a password for it. Backup user has the minimum privilege set
# `mysqldump --single-transaction --routines --triggers` needs.
mysql_backup_user: pfv_backup
mysql_backup_password: CHANGE_ME

# Tuned for s-1vcpu-2gb shared with Redis (300M cap) + OS overhead (~250M).
# MySQL gets ~1.4G of the 2G total. Adjust upward only if Redis stays
# well under its cap and the OS isn't paging.
mysql_max_connections: 100
mysql_innodb_buffer_pool_size: 768M
# One pool instance is the right call when the buffer pool is under ~1G;
# multiple instances at this scale just waste RAM on per-instance overhead.
mysql_innodb_buffer_pool_instances: 1
# TBD-360: replaced the deprecated innodb_log_file_size. 128M x the default
# innodb_log_files_in_group=2 is exactly the 256M capacity 8.4 computed from
# the old pair, so this is an equivalent restatement, not a resize.
mysql_innodb_redo_log_capacity: 256M
mysql_innodb_log_buffer_size: 16M
# tmp_table_size and max_heap_table_size MUST stay equal — MySQL silently
# clamps in-memory temp tables to the smaller of the two.
mysql_tmp_table_size: 32M
mysql_max_heap_table_size: 32M
# DO block storage is SSD-backed; the 200/400 InnoDB defaults are HDD-era.
# 1000/2000 lets InnoDB push more dirty pages per flush cycle, which is
# what the L4.7 audit-log + L4.9 request-log write workload wants.
mysql_innodb_io_capacity: 1000
mysql_innodb_io_capacity_max: 2000

# TBD-416. The server default is 31536000 seconds -- 365 DAYS. That is not a
# timeout, and nobody chose it. Measured on MySQL 8.4.11 (production's exact
# version) 2026-08-27: an unbounded RENAME TABLE behind one held metadata lock
# was still waiting when the probe gave up, with no error ever returned; the
# same statement under a bounded timeout failed cleanly in exactly that many
# seconds. See roles/mysql/templates/my.cnf.j2 for why 30 and not less.
mysql_lock_wait_timeout: 30
