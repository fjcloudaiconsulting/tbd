---
# TBD-360 — FAIL CLOSED ON AN UNSET SECRET, BEFORE ANYTHING IS WRITTEN.
#
# `inventory.yml` is gitignored, so these values live only on the operator's
# machine. If it is missing, the wrong `-i` is passed, or a var name is typo'd,
# Ansible silently falls back to the role defaults below (`CHANGE_ME`).
#
# That used to be survivable because the user tasks ran `update_password:
# on_create`. It is NOT survivable now: since the caching_sha2 conversion the
# three account tasks use `plugin_auth_string`, which is cleartext and cannot be
# compared, so they rewrite the password on EVERY run and always report
# `changed`. A missing inventory therefore sets the PRODUCTION app credential to
# the literal string "CHANGE_ME", reports success, and every App Platform
# connection dies at the next reconnect.
#
# There is no other guard: `changed: false` is no longer available as evidence
# that inventory and server agree (see MYSQL-84-CUTOVER.md, step 1).
- name: Assert MySQL secrets were supplied by the inventory, not defaulted
  ansible.builtin.assert:
    that:
      - mysql_app_password is defined
      - mysql_app_password | length > 0
      - mysql_app_password != 'CHANGE_ME'
      - mysql_backup_password is defined
      - mysql_backup_password | length > 0
      - mysql_backup_password != 'CHANGE_ME'
    quiet: true
    fail_msg: >-
      mysql_app_password and/or mysql_backup_password are unset or still at the
      role default. Refusing to run: this play rewrites those credentials
      unconditionally and would set the production password to "CHANGE_ME".
      Check that -i points at your real inventory.yml and that the vault opened.

- name: Install MySQL server
  ansible.builtin.apt:
    name:
      - mysql-server
      - python3-pymysql
    state: present

- name: Ensure MySQL is started and enabled
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: true

# Ubuntu 24.04 ships MySQL 8 with auth_socket on root@localhost — we keep that
# default. Local maintenance is done via `sudo mysql` (the socket plugin
# authenticates by uid, no password needed). We deliberately do NOT manage a
# password for root@localhost here: the `mysql_user ... update_password:
# on_create` form only sets the password when the user is first created, and
# root already exists from the apt package install. Re-running this play with
# a rotated `mysql_root_password` would silently rewrite /root/.my.cnf to a
# password MySQL never accepted, breaking subsequent tasks and cron dumps.
# Cron dumps use the dedicated `mysql_backup` user below.

# TBD-360 - the three accounts below moved from mysql_native_password to
# caching_sha2_password, because 8.4 ships the native_password component
# DISABLED: measured on a real mysql:8.4, PLUGIN_STATUS for
# mysql_native_password is DISABLED, and
# `CREATE USER ... IDENTIFIED WITH mysql_native_password` fails outright with
# ERROR 1524 "Plugin 'mysql_native_password' is not loaded". Converting the
# accounts is mandatory, and it must happen on 8.0 BEFORE the upgrade (an
# in-place conversion on 8.0 was verified to convert and still authenticate).
#
# WARNING: `plugin_auth_string`, NOT `password`. This is the difference
# between a working conversion and a total production outage, and it is
# silent. `community.mysql.mysql_user` IGNORES `password:` when `plugin:` is
# set: it writes the plugin and leaves `authentication_string` EMPTY.
# Measured against a real 8.0 with the real collection:
#
#     plugin + password:           plugin=caching_sha2_password, hash_len=0
#                                  -> "ERROR 1045 Access denied" for the app
#     plugin + plugin_auth_string: plugin=caching_sha2_password, hash_len=70
#                                  -> login OK
#
# The module reports `changed: true` and succeeds in BOTH cases, so the first
# form would convert pfv_app@% to a PASSWORDLESS account on the next run and
# take every App Platform connection down, before the 8.4 upgrade even starts.
#
# Known cost of this form: the play is NO LONGER IDEMPOTENT on these three
# tasks. `plugin_auth_string` is cleartext, so the module cannot compare it
# against the stored hash and rewrites it every run - measured `changed=3`
# on a second consecutive run against an already-converted server. The
# rewrite is the same credential, so it is functionally a no-op and the
# accounts keep working (verified: all three authenticate, and pfv_backup
# can still mysqldump). But do not read `changed` on these tasks as a
# signal that anything actually differed.
#
# All privileged mysql tasks pin login_user: root + login_unix_socket so they
# auth via root@localhost's auth_socket plugin regardless of whatever the
# mysql client would otherwise pick up from /root/.my.cnf (which exists from
# prior runs and points at the lower-privilege mysql_backup user).
- name: Create backup user (read-everything for mysqldump --single-transaction)
  community.mysql.mysql_user:
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: "{{ mysql_backup_user }}"
    host: localhost
    priv: "*.*:SELECT,LOCK TABLES,SHOW VIEW,EVENT,TRIGGER,RELOAD,PROCESS,REPLICATION CLIENT"
    plugin: caching_sha2_password
    plugin_auth_string: "{{ mysql_backup_password }}"
    state: present

- name: Remove anonymous MySQL users
  community.mysql.mysql_user:
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: ""
    host_all: true
    state: absent

- name: Remove MySQL test database
  community.mysql.mysql_db:
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: test
    state: absent

- name: Create application database
  community.mysql.mysql_db:
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: "{{ mysql_app_db }}"
    state: present
    encoding: utf8mb4
    collation: utf8mb4_0900_ai_ci

- name: Create application MySQL user (host=%)
  community.mysql.mysql_user:
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: "{{ mysql_app_user }}"
    host: "%"
    priv: "{{ mysql_app_db }}.*:ALL"
    plugin: caching_sha2_password
    plugin_auth_string: "{{ mysql_app_password }}"
    state: present

# MySQL treats host='%' and host='localhost' as distinct user rows. The
# host='%' grant covers private-VPC App Platform clients connecting over
# TCP, but it does NOT match `mysql -u pfv_app -h localhost` (UNIX socket)
# or `mysql -u pfv_app -h 127.0.0.1` (TCP loopback) on the data droplet
# itself, both fail with "Access denied". Adding the localhost grant lets
# the operator drop into a `pfv_app` shell directly on pfv-data-01 without
# tunnelling through the App Platform pod, which makes routine ops
# (schema spot-checks, ad-hoc queries) much cheaper. Privileges mirror
# the host='%' row exactly.
- name: Create application MySQL user (host=localhost)
  community.mysql.mysql_user:
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: "{{ mysql_app_user }}"
    host: localhost
    priv: "{{ mysql_app_db }}.*:ALL"
    plugin: caching_sha2_password
    plugin_auth_string: "{{ mysql_app_password }}"
    state: present

# Drop /root/.my.cnf AFTER all privileged mysql_user / mysql_db tasks complete.
# The mysql client library reads /root/.my.cnf when present and authenticates
# as the user listed there (mysql_backup), which does not have CREATE DATABASE
# / CREATE USER privilege — so any privileged task that runs after this file
# exists fails with "Access denied for user 'pfv_backup'". The cron mysqldump
# is the only consumer that needs this file.
- name: Drop /root/.my.cnf so cron mysqldump runs non-interactively
  ansible.builtin.template:
    src: root.my.cnf.j2
    dest: /root/.my.cnf
    owner: root
    group: root
    mode: "0600"

- name: Drop pfv MySQL config override
  ansible.builtin.template:
    src: my.cnf.j2
    dest: /etc/mysql/mysql.conf.d/pfv.cnf
    owner: root
    group: root
    mode: "0644"
  notify: Restart mysql
