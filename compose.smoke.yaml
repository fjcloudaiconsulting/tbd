# Post-release smoke test (shared smoke workflow, RELEASE_CONTRACT.md section 7): the published images by tag, no
# build. The workflow runs `migrations` twice (the second must be a no-op), then `up --wait`, then asserts /health
# reports the release's version and revision. APP_ENV=production so the backend boots with production validation and
# does NOT migrate on startup. Every credential is a throwaway literal for a database that lives for one CI run.
x-backend-env: &backend-env
  APP_ENV: production
  DATABASE_URL: mysql+aiomysql://tbd:smoke@mysql:3306/tbd
  JWT_SECRET_KEY: smoke-jwt-key-not-a-real-secret-0000000000
  API_TOKEN_HMAC_KEY: smoke-pat-key-not-a-real-secret-11111111111

services:
  mysql:
    image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    environment:
      MYSQL_ROOT_PASSWORD: smoke-root
      MYSQL_DATABASE: tbd
      MYSQL_USER: tbd
      MYSQL_PASSWORD: smoke
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psmoke-root", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60

  # One-shot, profile migrate: `up --wait` never sees an exited service.
  migrations:
    image: ${IMAGE_PREFIX}/migrations:${TAG}
    profiles: [migrate]
    depends_on:
      mysql:
        condition: service_healthy
    environment: *backend-env

  backend:
    image: ${IMAGE_PREFIX}/backend:${TAG}
    depends_on:
      mysql:
        condition: service_healthy
    environment: *backend-env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      start_period: 60s
      start_interval: 1s

  frontend:
    image: ${IMAGE_PREFIX}/frontend:${TAG}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      TBD_API_URL: ""
      BACKEND_INTERNAL_URL: http://backend:8000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      start_period: 60s
      start_interval: 1s
